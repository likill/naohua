spring:
  application:
    name: yu-ai-code-mother-backend
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/code_mother
    username: root
    password: 123456
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      ttl: 3600 # 缓存过期时间（秒）
  # 阿里云邮件推送（DirectMail）SMTP 配置
  # host 固定可用 smtpdm.aliyun.com；username/password 填阿里云邮件推送控制台生成的 SMTP 账号和密码
  mail:
    host: smtpdm.aliyun.com
    port: 465
    username: your-direct-mail-smtp-username
    password: your-direct-mail-smtp-password
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  profiles:
    active: prod
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yupi.yuaicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
#      api-key: <Your API Key>
      model-name: deepseek-v4-flash
#      strict-json-schema: true
#      response-format: json_object
      max-tokens: 8192
      log-requests: true
      log-responses: true
      max-retries: 3
    streaming-chat-model:
      base-url: https://api.deepseek.com
#      api-key: <Your API Key>
      model-name: deepseek-v4-flash
      max-tokens: 8192
      log-requests: true
      log-responses: true
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
#      api-key: <Your API Key>
      model-name: deepseek-v4-flash
      max-tokens: 32768
      temperature: 0.1
      log-requests: true
      log-responses: true
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: https://api.deepseek.com
#      api-key: <Your API Key>
      model-name: deepseek-v4-flash
      max-tokens: 100
      log-requests: true
      log-responses: true
# 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: your-custom-domain.com
    secretId: your-secret-id
    secretKey: your-secret-key
    region: ap-shanghai
    bucket: your-bucket-name
# Pexels 图片搜索配置
pexels:
#  api-key: <Your API Key>
# 统一验证码登录/注册
auth:
  code:
    expire-minutes: 5
    resend-interval-seconds: 60
    daily-target-limit: 10
    hourly-ip-limit: 60
    max-fail-count: 5
    fail-lock-minutes: 15
    sms:
      # 阿里云短信服务 AccessKey
      access-key-id: your-aliyun-sms-access-key-id
      access-key-secret: your-aliyun-sms-access-key-secret
      # 一般使用 cn-hangzhou 即可
      region-id: cn-hangzhou
      # 已审核通过的短信签名和模板 Code，模板变量必须包含 ${code}
      sign-name: your-sms-sign-name
      template-code: your-sms-template-code
    mail:
      # 发信地址，需要和阿里云邮件推送里配置/验证的发信地址一致
      from: your-sender@example.com
      subject: 脑花登录验证码
# 阿里云 DashScope 配置
dashscope:
#  api-key: <Your API Key>
  image-model: wan2.2-t2i-flash
# 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
